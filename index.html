<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Смета за 5 минут</h1>

    <section class="card">
      <h2>Реквизиты</h2>
      <div class="requisites">
        <label>От кого <input type="text" id="from" placeholder="Ваше имя или компания"></label>
        <label>Для кого <input type="text" id="to" placeholder="Клиент"></label>
        <label>Номер <input type="text" id="number" placeholder="1"></label>
        <label>Дата <input type="date" id="date"></label>
      </div>
    </section>

    <section class="card">
      <h2>Позиции</h2>
      <table class="items">
        <thead>
          <tr>
            <th>Название</th>
            <th>Кол-во</th>
            <th>Ед.</th>
            <th>Цена</th>
            <th>Сумма</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="row-actions">
        <button type="button" id="add" class="add">+ Добавить позицию</button>
        <button type="button" id="clear" class="add">Очистить смету</button>
      </div>
    </section>

    <section class="card">
      <h2>Расчёт</h2>
      <div class="settings">
        <label>Скидка, % <input type="number" id="discount" min="0" max="100" step="any" inputmode="decimal" value="0"></label>
        <label>НДС, % <input type="number" id="vat" min="0" step="any" inputmode="decimal" value="0"></label>
        <label>Валюта
          <select id="currency">
            <option value="₸">₸ тенге</option>
            <option value="₽">₽ рубли</option>
            <option value="$">$ доллары</option>
            <option value="€">€ евро</option>
          </select>
        </label>
      </div>
      <dl class="summary">
        <div><dt>Сумма позиций</dt><dd id="subtotal">0 ₸</dd></div>
        <div id="discount-row" hidden><dt>Скидка <span id="discount-label"></span></dt><dd id="discount-amount">0 ₸</dd></div>
        <div id="after-discount-row" hidden><dt>Со скидкой</dt><dd id="after-discount">0 ₸</dd></div>
        <div id="vat-row" hidden><dt>НДС <span id="vat-label"></span></dt><dd id="vat-amount">0 ₸</dd></div>
        <div class="grand"><dt>Итого к оплате</dt><dd id="total">0 ₸</dd></div>
      </dl>
      <button type="button" id="print" class="add">Сохранить PDF</button>
    </section>
  </main>

  <!-- Документ для печати: виден только в PDF -->
  <section id="print-doc" class="print-doc"></section>

  <template id="row-template">
    <tr>
      <td data-label="Название"><input type="text" class="name" placeholder="Например, покраска"></td>
      <td data-label="Кол-во"><input type="number" class="qty" min="0" step="any" inputmode="decimal"></td>
      <td data-label="Ед."><input type="text" class="unit" value="шт"></td>
      <td data-label="Цена"><input type="number" class="price" min="0" step="any" inputmode="decimal"></td>
      <td data-label="Сумма" class="sum">0 ₸</td>
      <td><button type="button" class="remove" aria-label="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
